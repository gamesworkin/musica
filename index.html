<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Personal Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="login-screen" class="modal-overlay">
        <div class="login-box">
            <h2><i class="fab fa-youtube text-red"></i> Meu YouTube Player</h2>
            <input type="text" id="login-user" placeholder="Digite seu usuário de acesso">
            <input type="password" id="login-pass" placeholder="Digite sua senha de acesso">
            <button id="btn-login">Entrar</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <header class="main-header">
            <div class="header-left">
                <button id="toggle-sidebar" class="icon-btn"><i class="fas fa-bars"></i></button>
                <div class="logo">Stream<span>Hub</span></div>
            </div>
            
            <div class="search-container">
                <i class="fab fa-youtube search-icon text-red"></i>
                <input type="text" id="search-yt-input" placeholder="Pesquisar músicas direto no YouTube...">
            </div>

            <button id="btn-open-admin" class="admin-btn"><i class="fas fa-cog"></i> Gerenciar</button>
        </header>

        <div class="wrapper">
            <nav id="sidebar" class="sidebar">
                <div class="internal-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-internal-input" placeholder="Filtrar minhas categorias...">
                </div>
                <h3>Categorias</h3>
                <ul id="sidebar-tree" class="tree-menu">
                    </ul>
            </nav>

            <main class="main-content">
                <div class="breadcrumb">
                    <span id="bc-root" class="clickable">Início</span>
                    <span id="bc-category" class="hidden"> > <span class="txt"></span></span>
                    <span id="bc-subcategory" class="hidden"> > <span class="txt"></span></span>
                    <span id="bc-search" class="hidden"> > <span class="txt">Resultados do YouTube</span></span>
                </div>

                <div id="player-container" class="player-container hidden">
                    <div class="video-wrapper">
                        <div id="yt-player"></div>
                    </div>
                    <div class="player-info">
                        <h4 id="current-track-title">Nenhuma música reproduzindo</h4>
                        <button id="btn-close-player" class="icon-btn"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <section id="mosaic-grid" class="mosaic-grid">
                    </section>
            </main>
        </div>
    </div>

    <div id="admin-modal" class="modal-overlay hidden">
        <div class="modal-content admin-box">
            <div class="modal-header">
                <h3>Painel de Controle (Firebase & YouTube API)</h3>
                <button id="btn-close-admin" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="add-tab">Adicionar Mídia</button>
                <button class="tab-btn" data-tab="manage-tab">Editar / Excluir / Exportar</button>
            </div>

            <div id="add-tab" class="tab-content">
                <div class="preview-box" id="yt-preview">
                    <img id="prev-thumb" src="https://placehold.co/120x90?text=Sem+Thumb" alt="Thumbnail">
                    <input type="text" id="prev-title" placeholder="Título do Vídeo capturado">
                </div>
                <div class="form-group">
                    <input type="text" id="media-category" placeholder="Categoria (ex: Rock, Pop) - Digite Manualmente">
                    <input type="text" id="media-subcategory" placeholder="Subcategoria (ex: Anos 80, Ao Vivo) - Digite Manualmente">
                </div>
                <button id="btn-save-media" class="save-btn"><i class="fas fa-save"></i> Salvar no meu Firebase</button>
            </div>

            <div id="manage-tab" class="tab-content hidden">
                <div class="backup-actions">
                    <button id="btn-export-json" class="btn-secondary"><i class="fas fa-download"></i> Exportar Tudo (JSON)</button>
                </div>
                <div id="crud-tree-list" class="crud-list">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
